<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi persona favorita</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            color: #ff0000;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #input-container {
            text-align: center;
            z-index: 100;
        }

        input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #ff0000;
            color: #ff0000;
            font-size: 2rem;
            text-align: center;
            outline: none;
            margin-top: 20px;
        }

        button {
            background: #ff0000;
            color: black;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 5px;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px #ff0000;
        }

        .heart-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            top: 0;
            left: 0;
        }

        .name-particle {
            position: absolute;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
        }

        /* Botón de reinicio */
        #reset-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: none; /* Se oculta al inicio */
            z-index: 200;
            opacity: 0.7;
        }

        #reset-btn:hover {
            opacity: 1;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="input-container">
        <h1>Escribe tu nombre</h1>
        <input type="text" id="nombreInput" placeholder="..." onkeydown="if(event.key==='Enter') crearCorazon()">
        <br>
        <button onclick="crearCorazon()">Ver magia</button>
    </div>

    <div id="heart" class="heart-container"></div>

    <button id="reset-btn" onclick="reiniciar()">Reiniciar ❤️</button>

    <script>
        function crearCorazon() {
            const nombre = document.getElementById('nombreInput').value;
            if (!nombre) return;

            document.getElementById('input-container').style.display = 'none';
            const contenedor = document.getElementById('heart');
            contenedor.innerHTML = ''; // Limpiar si había algo antes
            contenedor.style.display = 'block';

            const centroX = window.innerWidth / 2;
            const centroY = window.innerHeight / 2;
            const escalaBase = 18; 
            
            let delay = 0;
            const capasTotales = 15;

            for (let capa = capasTotales; capa >= 0; capa--) {
                const radioRelativo = capa / capasTotales;
                const particulasEnCapa = 20 + (capa * 15);

                for (let i = 0; i < particulasEnCapa; i++) {
                    const t = (i / particulasEnCapa) * 2 * Math.PI;
                    
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

                    setTimeout(() => {
                        const span = document.createElement('span');
                        span.className = 'name-particle';
                        span.innerText = nombre;
                        
                        span.style.left = (centroX + x * escalaBase * radioRelativo) + 'px';
                        span.style.top = (centroY + y * escalaBase * radioRelativo) + 'px';
                        
                        contenedor.appendChild(span);

                        // Mostrar el botón de reinicio cuando se termine de dibujar la última partícula
                        if (capa === 0 && i === particulasEnCapa - 1) {
                            document.getElementById('reset-btn').style.display = 'block';
                        }
                    }, delay);
                    
                    delay += 3; 
                }
            }
        }

        function reiniciar() {
            // Ocultar contenedor de corazón y botón
            document.getElementById('heart').style.display = 'none';
            document.getElementById('reset-btn').style.display = 'none';
            
            // Limpiar el input y mostrar el inicio
            const input = document.getElementById('nombreInput');
            input.value = '';
            document.getElementById('input-container').style.display = 'block';
            input.focus();
        }
    </script>
</body>
</html>
